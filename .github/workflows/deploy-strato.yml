# ============================================================
#  Veroeffentlichung auf den STRATO-Webspace per SFTP.
#
#  Zwei Betriebsarten, auswaehlbar beim manuellen Start:
#    auflisten  - verbindet sich und zeigt nur, was auf dem Server
#                 liegt. Aendert nichts. Dient dazu, das richtige
#                 Zielverzeichnis zu finden.
#    hochladen  - spiegelt das Repository in das Zielverzeichnis.
#
#  Vorerst nur manuell ausloesbar, damit ein fehlender Zugangsdatensatz
#  keine Fehlermeldungen bei jedem Push erzeugt. Sobald ein Durchlauf
#  sauber war, wird der Ausloeser "push" aktiviert.
#
#  Benoetigte Secrets (Settings -> Secrets and variables -> Actions):
#    STRATO_HOST  51800476.ssh.w1.strato.hosting
#    STRATO_USER  stu447977203
#    STRATO_PASS  eigenes Passwort des SFTP-Benutzers,
#                 NICHT das Passwort des STRATO-Kundenkontos
#  Das Zielverzeichnis ist KEIN Secret - als einzelner Schraegstrich
#  wuerde GitHub sonst jeden Pfad im Protokoll unkenntlich machen.
#  Abweichung ueber die Repository-Variable STRATO_PATH moeglich.
#
#  Die Zugangsdaten gehoeren ausschliesslich in diese Secrets -
#  niemals in eine Datei im Repository.
# ============================================================

name: Auf STRATO veroeffentlichen

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll passieren?"
        required: true
        default: auflisten
        type: choice
        options:
          - auflisten
          - hochladen
          - aufraeumen
  # push:
  #   branches: [main]

concurrency:
  group: deploy-strato
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Stand auschecken
        uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Zugangsdaten pruefen
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          PASS: ${{ secrets.STRATO_PASS }}
          DEST: ${{ vars.STRATO_PATH || '/brunotte.de' }}
        run: |
          fehlt=""
          [ -n "$HOST" ] || fehlt="$fehlt STRATO_HOST"
          [ -n "$USER" ] || fehlt="$fehlt STRATO_USER"
          [ -n "$PASS" ] || fehlt="$fehlt STRATO_PASS"
          if [ -n "$fehlt" ]; then
            echo "Fehlende Secrets:$fehlt"
            exit 1
          fi
          echo "Zugangsdaten vollstaendig. Zielverzeichnis: $DEST"

      # ----------------------------------------------------------
      #  Nur nachsehen. Aendert nichts auf dem Server.
      # ----------------------------------------------------------
      - name: Verzeichnisse auflisten
        if: ${{ inputs.modus == 'auflisten' }}
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          PASS: ${{ secrets.STRATO_PASS }}
          DEST: ${{ vars.STRATO_PATH || '/brunotte.de' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            open -u '$USER','$PASS' sftp://$HOST;
            echo '--- Startverzeichnis ---';
            cd /; cls -l --sort=name;
            echo;
            echo '--- Zielverzeichnis $DEST ---';
            cd '$DEST'; cls -l --sort=name;
          "

      # ----------------------------------------------------------
      #  Hochladen. Loescht nichts: Dateien, die auf dem Server
      #  liegen und nicht im Repository stehen, bleiben unberuehrt.
      # ----------------------------------------------------------
      - name: Dateien hochladen
        if: ${{ inputs.modus == 'hochladen' }}
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          PASS: ${{ secrets.STRATO_PASS }}
          DEST: ${{ vars.STRATO_PATH || '/brunotte.de' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$USER','$PASS' sftp://$HOST;
            mkdir -p '$DEST';
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .gitignore \
              --exclude-glob CLAUDE.md \
              --exclude-glob vercel.json \
              --exclude-glob stakeholder-analyse.* \
              --exclude-glob entwurf.html \
              --exclude-glob redesign*.html \
              --exclude-glob notizen/ \
              --exclude-glob mb.jpg \
              ./ '$DEST';
            echo;
            echo '--- Platzhalter von STRATO entfernen ---';
            rm -f '$DEST/index.htm' || echo 'index.htm war nicht vorhanden';
            echo;
            echo '--- Inhalt nach dem Hochladen ---';
            cd '$DEST'; cls -l --sort=name;
          "


      # ----------------------------------------------------------
      #  Einmaliges Aufraeumen: entfernt den doppelten Dateisatz aus
      #  dem Wurzelverzeichnis, der beim ersten Umzugsversuch dort
      #  gelandet ist. Namentlich aufgefuehrt, kein Platzhalter.
      #  Es bleiben: cgi-bin/ (von STRATO), brunotte.de/ (die Seite)
      #  und die .htaccess (leitet die Paketadresse auf die Seite um).
      # ----------------------------------------------------------
      - name: Wurzelverzeichnis aufraeumen
        if: ${{ inputs.modus == 'aufraeumen' }}
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          PASS: ${{ secrets.STRATO_PASS }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            open -u '$USER','$PASS' sftp://$HOST;
            cd /;
            rm -f 'index.html' || echo 'nicht vorhanden: index.html';
            rm -f 'impressum.html' || echo 'nicht vorhanden: impressum.html';
            rm -f 'datenschutz.html' || echo 'nicht vorhanden: datenschutz.html';
            rm -f 'recht.css' || echo 'nicht vorhanden: recht.css';
            rm -f 'portrait.jpg' || echo 'nicht vorhanden: portrait.jpg';
            rm -f 'portrait-600.jpg' || echo 'nicht vorhanden: portrait-600.jpg';
            rm -f 'favicon.ico' || echo 'nicht vorhanden: favicon.ico';
            rm -f 'favicon-16.png' || echo 'nicht vorhanden: favicon-16.png';
            rm -f 'favicon-32.png' || echo 'nicht vorhanden: favicon-32.png';
            rm -f 'icon-192.png' || echo 'nicht vorhanden: icon-192.png';
            rm -f 'icon-512.png' || echo 'nicht vorhanden: icon-512.png';
            rm -f 'apple-touch-icon.png' || echo 'nicht vorhanden: apple-touch-icon.png';
            rm -rf 'fonts' || echo 'fonts nicht vorhanden';
            echo;
            echo '--- Wurzelverzeichnis danach ---';
            cls -l --sort=name;
          "
      - name: Erreichbarkeit der oeffentlichen Seite
        if: ${{ inputs.modus == 'hochladen' }}
        run: |
          echo "Hinweis: Solange die Domain noch auf Vercel zeigt,"
          echo "pruefen diese Abrufe die ALTE Seite, nicht den Webspace."
          for p in / /impressum.html /datenschutz.html /recht.css /fonts/hanken-grotesk-400-latin.woff2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.brunotte.de$p" || echo "---")
            printf '%-48s %s\n' "$p" "$code"
          done
